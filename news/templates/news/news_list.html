<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Latest News</title>
    <!-- ✅ ใช้ Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="#">📰 News Aggregator</a>
        </div>
    </nav>

    <div class="container mt-4">
        <h1 class="text-center mb-4">📰 Latest News</h1>
        
        <div class="row">
            {% for article in articles %}
                <div class="col-md-4">
                    <div class="card mb-4 shadow-sm">
                        {% if article.urlToImage %}
                            <img src="{{ article.urlToImage }}" class="card-img-top" alt="News Image">
                        {% else %}
                            <img src="https://via.placeholder.com/400x200?text=No+Image" class="card-img-top" alt="No Image">
                        {% endif %}
                        <div class="card-body">
                            <h5 class="card-title">{{ article.title }}</h5>
                            <p class="card-text">{{ article.description|default:"No description available." }}</p>
                            <a href="{{ article.url }}" class="btn btn-primary" target="_blank">Read more</a>
                        </div>
                    </div>
                </div>
            {% empty %}
                <p class="text-center">No news available.</p>
            {% endfor %}
        </div>
    </div>

    <!-- ✅ ใช้ Bootstrap JS (จำเป็นสำหรับบางฟีเจอร์) -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
